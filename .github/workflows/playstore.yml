name: Build & Deploy to Google Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Next.js & Deploy AAB to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Lint Code
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-increment Version Code & Generate Checksum
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const file = 'twa-manifest.json';
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.appVersionCode = ${{ github.run_number }};
            const updatedContent = JSON.stringify(data, null, 2);
            fs.writeFileSync(file, updatedContent);
            const hash = crypto.createHash('sha256').update(updatedContent).digest('hex');
            fs.writeFileSync('twa-manifest-checksum.json', JSON.stringify({ checksum: hash }, null, 2));
            console.log('Updated appVersionCode to', data.appVersionCode, 'with checksum:', hash);
          "

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android App Bundle (AAB)
        run: ./gradlew bundleRelease

      - name: Sign Android App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          filePattern: '*.aab'

      - name: Upload AAB to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.rutambh.shubhsamay
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: internal
          status: completed
