name: Build & Deploy to Google Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Next.js & Deploy AAB to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Lint Code
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-increment Version Code & Name, Generate Checksum
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const file = 'twa-manifest.json';
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.appVersionCode = ${{ github.run_number }};
            const parts = (data.appVersionName || '1.0.0').split('.');
            parts[2] = String(parseInt(parts[2] || '0') + 1);
            data.appVersionName = parts.join('.');
            data.appVersion = data.appVersionName;
            const updatedContent = JSON.stringify(data, null, 2);
            fs.writeFileSync(file, updatedContent);
            const hash = crypto.createHash('sha256').update(updatedContent).digest('hex');
            fs.writeFileSync('twa-manifest-checksum.json', JSON.stringify({ checksum: hash }, null, 2));
            console.log('Bumped versionCode to', data.appVersionCode, '| versionName to', data.appVersionName);
          "

      - name: Commit & Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twa-manifest.json twa-manifest-checksum.json
          git commit -m "chore: bump version to ${{ github.run_number }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "import base64, os; open('rutambhapps.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64']))"

      - name: Inspect Keystore Alias Name
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore rutambhapps.jks -storepass "$KEYSTORE_PASSWORD" || true

      - name: Build & Sign Android App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew bundleRelease

      - name: Upload AAB Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android-app/build/outputs/bundle/release/*.aab

      - name: Upload AAB to Play Store (Internal Testing Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.rutambh.shubhsamay
          releaseFiles: android-app/build/outputs/bundle/release/*.aab
          track: internal
          whatsNewDirectory: whatsnew/
