name: Build & Deploy to Google Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Next.js & Deploy AAB to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Lint Code
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-increment Version Code
        run: |
          node -e "
            const fs = require('fs');
            const file = 'twa-manifest.json';
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.appVersionCode = ${{ github.run_number }};
            fs.writeFileSync(file, JSON.stringify(data, null, 2));
            console.log('Updated appVersionCode to', data.appVersionCode);
          "

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > rutambhapps.jks

      - name: Build Signed Android App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ALIAS="${KEY_ALIAS:-com.rutambh.shubhsamay}"
          npx @bubblewrap/cli build --signingKeyPath=./rutambhapps.jks --signingKeyAlias="$ALIAS" --signingKeyPassword="$KEY_PASSWORD" --keyStorePassword="$KEYSTORE_PASSWORD"

      - name: Upload AAB to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.rutambh.shubhsamay
          releaseFiles: app-release-bundle.aab
          track: internal
          status: completed
